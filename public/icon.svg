<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E73E8"/>
      <stop offset="100%" stop-color="#0A42B3"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Clipboard -->
  <g transform="translate(126, 60)">
    <!-- Clipboard Outline -->
    <rect x="25" y="50" width="210" height="250" rx="20" fill="none" stroke="#FFFFFF" stroke-width="16"/>
    <!-- Clipboard Top Clip -->
    <path d="M 85 50 Q 85 30 105 30 L 155 30 Q 175 30 175 50 Z" fill="#FFFFFF"/>
    <circle cx="130" cy="40" r="8" fill="#1E73E8"/>
    
    <!-- Checkmarks & Lines -->
    <path d="M 55 105 L 75 125 L 110 90" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="125" y1="110" x2="200" y2="110" stroke="#90CAF9" stroke-width="12" stroke-linecap="round"/>
    
    <path d="M 55 165 L 75 185 L 110 150" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="125" y1="170" x2="200" y2="170" stroke="#90CAF9" stroke-width="12" stroke-linecap="round"/>
    
    <path d="M 55 225 L 75 245 L 110 210" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="125" y1="230" x2="170" y2="230" stroke="#90CAF9" stroke-width="12" stroke-linecap="round"/>

    <!-- HardHat Helmet Overlap -->
    <g transform="translate(120, 160)">
      <path d="M 10 90 Q 70 70 130 90 Q 140 95 130 102 Q 70 85 0 102 Q -10 95 10 90 Z" fill="#FFFFFF"/>
      <path d="M 20 85 C 15 35, 45 10, 70 10 C 95 10, 125 35, 120 85 Z" fill="#FFFFFF"/>
      <line x1="70" y1="10" x2="70" y2="85" stroke="#1E73E8" stroke-width="6"/>
      <line x1="45" y1="20" x2="45" y2="85" stroke="#1E73E8" stroke-width="4"/>
      <line x1="95" y1="20" x2="95" y2="85" stroke="#1E73E8" stroke-width="4"/>
    </g>
  </g>

  <!-- DDPS Text -->
  <text x="256" y="440" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DDPS</text>
</svg>
